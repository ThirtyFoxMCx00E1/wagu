; TV Player 設定ファイル (スクリプトはこのファイルを読むだけで、書き換えません)
; 変更後はゲームを再起動するか、MoonLoader のスクリプト再読み込みで反映されます。

[Player]
; 音量 0-100 (再生中に変えた音量はゲームを終了すると元に戻ります)
Volume=80
; テレビにこの距離 (m) まで近づくと [F] の案内が出ます
PromptDistance=2.5
; テレビからこの距離 (m) 以上離れると自動で停止します
StopDistance=20
; この距離 (m) までは最大音量。そこから StopDistance に向けて小さくなります
FullVolumeDistance=4
; 早送り・巻き戻しの秒数
SeekSeconds=10
; 音量キー1回で変わる量
VolumeStep=10
; 1 = 1本の動画を繰り返し再生
Loop=0
; 1 = 終わったらフォルダ内の次の動画を再生
AutoNext=1
; 0 = 比率を保って黒帯を入れる / 1 = 画面いっぱいに引き伸ばす
Stretch=0
; 明るさ 0-100
Brightness=100
; 1 = 手前の物 (人や家具) で映像が隠れる / 0 = 常に映像を手前に描く (表示がおかしい時に試す)
DepthTest=1
; 深度のずらし量 (m)。映像がちらつく時は少し大きく (0.02 など)
DepthOffset=0.01
; 操作後に再生情報を表示する秒数
OsdSeconds=4
; 1 = moonloader.log に近くのモデル番号を書く (表示されないテレビの報告用) / 1 = write the model ids near you to moonloader.log (to report a TV that does not show)
Debug=0
; 1.5: frames per second of image sequence folders without an info.ini
Fps=30
; 1.5: 1 = the picture is a 3D mesh on the TV (hidden by what stands in front of it) / 0 = flat 2D picture on top
;      (try 0 if the small preview in the top right moves but the TV itself stays black)
Render3D=1
; 1.5: 1 = small preview of the picture in the top right while the info line shows / 0 = off (1.6: off by default)
Preview=0
; 1.6: 1 = the video goes on the TV model's own screen (the game draws it as part of the TV) / 0 = 3D mesh only
;      (MonetLoader for MP 3.8.7, MP 4.13.45+; if the TV is not found the 3D mesh is used)
Surface=1

[Keys]
; キー名: A-Z, 0-9, F1-F12, LEFT RIGHT UP DOWN, HOME END PRIOR(PgUp) NEXT(PgDn), INSERT DELETE, BACK, SPACE, NUMPAD0-9
; または 0x46 のような仮想キーコード
PlayStop=F
Pause=P
SeekBack=LEFT
SeekForward=RIGHT
Restart=HOME
VolumeUp=UP
VolumeDown=DOWN
Prev=PRIOR
Next=NEXT
