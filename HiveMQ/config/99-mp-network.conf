# Network tuning for the MP broker (installed by install.sh)
# BBR + fq: lower latency on lossy mobile connections
net.core.default_qdisc = fq
net.ipv4.tcp_congestion_control = bbr
# don't let the kernel hide seconds of unsent data (old positions = lag)
net.ipv4.tcp_notsent_lowat = 4096
# many players: more sockets, faster cleanup
net.core.somaxconn = 8192
net.ipv4.tcp_max_syn_backlog = 8192
net.ipv4.tcp_fin_timeout = 15
net.ipv4.tcp_tw_reuse = 1
net.ipv4.ip_local_port_range = 10240 65535
fs.file-max = 2097152
# keepalive: notice dead phones sooner
net.ipv4.tcp_keepalive_time = 60
net.ipv4.tcp_keepalive_intvl = 10
net.ipv4.tcp_keepalive_probes = 6
# SYN flood protection
net.ipv4.tcp_syncookies = 1
# UDP game port
# 3.22: 25 MB, so a burst from 100 phones never overflows mp_server's 8 MB socket buffer
net.core.rmem_max = 26214400
net.core.wmem_max = 26214400
# 3.11: lower relay latency (real, measured on the wire)
# MQTT traffic is bursty: don't drop back to slow start after a short pause (that was a 200-500 ms spike)
net.ipv4.tcp_slow_start_after_idle = 0
# don't cork small writes (each relay frame is small and must leave at once)
net.ipv4.tcp_autocorking = 0
# remember good paths: start new phone connections with the last known window / RTT
net.ipv4.tcp_no_metrics_save = 0
# fast loss recovery on mobile data
net.ipv4.tcp_sack = 1
net.ipv4.tcp_early_retrans = 3
net.ipv4.tcp_recovery = 1
net.ipv4.tcp_fastopen = 3
# UDP game ports (direct UDP from 3.11 phones + voice chat): bigger default buffers
net.core.rmem_default = 1048576
net.core.wmem_default = 1048576
net.core.netdev_max_backlog = 16384
