# Network tuning for the MP broker (installed by install.sh)
# BBR + fq: lower latency on lossy mobile connections
net.core.default_qdisc = fq
net.ipv4.tcp_congestion_control = bbr
# don't let the kernel hide seconds of unsent data (old positions = lag)
net.ipv4.tcp_notsent_lowat = 4096
# many players: more sockets, faster cleanup
net.core.somaxconn = 8192
net.ipv4.tcp_max_syn_backlog = 8192
net.ipv4.tcp_fin_timeout = 15
net.ipv4.tcp_tw_reuse = 1
net.ipv4.ip_local_port_range = 10240 65535
fs.file-max = 2097152
# keepalive: notice dead phones sooner
net.ipv4.tcp_keepalive_time = 60
net.ipv4.tcp_keepalive_intvl = 10
net.ipv4.tcp_keepalive_probes = 6
# SYN flood protection
net.ipv4.tcp_syncookies = 1
# UDP game port
# 3.22: 25 MB, so a burst from 100 phones never overflows mp_server's 8 MB socket buffer
net.core.rmem_max = 26214400
net.core.wmem_max = 26214400
# 3.11: lower relay latency (real, measured on the wire)
# MQTT traffic is bursty: don't drop back to slow start after a short pause (that was a 200-500 ms spike)
net.ipv4.tcp_slow_start_after_idle = 0
# don't cork small writes (each relay frame is small and must leave at once)
net.ipv4.tcp_autocorking = 0
# remember good paths: start new phone connections with the last known window / RTT
net.ipv4.tcp_no_metrics_save = 0
# fast loss recovery on mobile data
net.ipv4.tcp_sack = 1
net.ipv4.tcp_early_retrans = 3
net.ipv4.tcp_recovery = 1
net.ipv4.tcp_fastopen = 3
# UDP game ports (direct UDP from 3.11 phones + voice chat): bigger default buffers
net.core.rmem_default = 1048576
net.core.wmem_default = 1048576
net.core.netdev_max_backlog = 16384
# ---- 3.37 VPS update: steady ping with 100+ players, no lag spikes ----
# more packets handled per softirq round: a join burst from many phones is drained in one go
net.core.netdev_budget = 600
net.core.netdev_budget_usecs = 4000
net.core.optmem_max = 65536
# UDP: each socket keeps at least 16 KB even when the machine is busy (no drops under memory pressure)
net.ipv4.udp_rmem_min = 16384
net.ipv4.udp_wmem_min = 16384
# connection tracking (MQTT / SSH): room for thousands of phones + port scans; game UDP skips it (mp-net-tune)
net.netfilter.nf_conntrack_max = 262144
net.netfilter.nf_conntrack_udp_timeout = 30
net.netfilter.nf_conntrack_udp_timeout_stream = 60
net.netfilter.nf_conntrack_tcp_timeout_established = 3600
# memory: keep the servers in RAM (swapping = seconds of lag), write logs in small steps (no I/O stalls)
vm.swappiness = 10
vm.dirty_background_bytes = 16777216
vm.dirty_bytes = 67108864
vm.vfs_cache_pressure = 50
# no background memory compaction jitter (THP defrag is "defer" in mp-net-tune)
vm.compaction_proactiveness = 0
# fewer TCP retries to dead phones: their MQTT session is freed in ~25 s instead of 15 min
net.ipv4.tcp_retries2 = 8
net.ipv4.tcp_orphan_retries = 2
# path MTU problems on mobile networks: probe instead of hanging
net.ipv4.tcp_mtu_probing = 1
# many phones (each MQTT connection is a socket)
fs.nr_open = 2097152
