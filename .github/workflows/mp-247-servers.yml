# MP 24/7 featured servers (3.53, 3.58: 5 servers): MP LAN Server (Default), Brief Case War,
# Call Of Duty: Modern Warfare 3, Mega Vil Futuristic, Project Day Z Legacy - hosted by the Broker bot non stop, the same way
# the Discord bot ("MP Railway cloud runner") stays online: each run is one ~5 h 40 min shift and
# queues the next shift itself. The next shift starts BEFORE the old one stops (overlap), so the servers
# never go offline between shifts; players on the old copy are moved to the new copy automatically.
# The hourly cron is only a safety net that restarts the chain if a shift ever failed.
# Server data (homes, turf, progress, MW3 stats, RP citizens, bans) is kept on the mp247-data branch.
# Turn it off (e.g. when a VPS runs server/run_24_7.sh): repository variable MP247_RUNNER = off.
name: MP 24/7 featured servers

on:
  workflow_dispatch:
    inputs:
      handoff:
        description: 'Started by the previous shift (internal)'
        required: false
        default: 'false'
  push:
    branches: [main]
    paths: ['.github/workflows/mp-247-servers.yml', 'server/**', 'src/net/**']
  schedule:
    - cron: '7 * * * *'

permissions:
  contents: write
  actions: write

jobs:
  servers:
    if: vars.MP247_RUNNER != 'off'
    runs-on: ubuntu-latest
    timeout-minutes: 358
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      REGION: ${{ vars.MP247_REGION || 'Asia' }}
      SHIFT_MIN: 340        # queue the next shift after this many minutes
      OVERLAP_MIN: 6        # keep serving this long after the next shift was queued
    steps:
      - name: Skip if a shift is already running
        id: guard
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.handoff }}" = "true" ]; then
            echo "run=1" >> "$GITHUB_OUTPUT"; exit 0; fi
          # 4.05.1: a failed lookup no longer counts as "nothing running" (that started a second chain of
          # shifts that then ran beside the first one forever = every 24/7 server listed twice)
          n=""
          for i in 1 2 3; do
            n=$(gh run list -R "$GITHUB_REPOSITORY" -w mp-247-servers.yml -s in_progress --json databaseId \
                 --jq "[.[] | select(.databaseId != ${{ github.run_id }})] | length") && break
            n=""; sleep 10
          done
          if [ -z "$n" ]; then echo "Could not read the running shifts - not starting (the hourly check tries again)."; echo "run=0" >> "$GITHUB_OUTPUT"
          elif [ "$n" -gt 0 ]; then echo "A shift is already online - nothing to do."; echo "run=0" >> "$GITHUB_OUTPUT"
          else echo "run=1" >> "$GITHUB_OUTPUT"; fi

      - uses: actions/checkout@v4
        if: steps.guard.outputs.run == '1'

      - name: Cache server build
        if: steps.guard.outputs.run == '1'
        uses: actions/cache@v4
        with:
          path: server/obj
          key: mp-server-obj-${{ hashFiles('server/Makefile', 'src/net/**', 'server/*.cpp', 'mbedtls/**') }}
          restore-keys: mp-server-obj-

      - name: Build mp_server
        if: steps.guard.outputs.run == '1'
        run: make -C server -j"$(nproc)"

      - name: Load saved server data
        if: steps.guard.outputs.run == '1'
        run: |
          if git fetch -q --depth 1 origin mp247-data 2>/dev/null; then
            for f in bans.txt homes.txt homes_rp.txt mw3_stats.txt progress.txt ranks.txt rp_citizens.txt dayz_survivors.txt turf.txt; do
              git show "FETCH_HEAD:$f" > "server/$f" 2>/dev/null || rm -f "server/$f"; done
            echo "data restored"; else echo "no saved data yet"; fi

      - name: Run the 5 servers (one shift)
        if: steps.guard.outputs.run == '1'
        shell: bash {0}   # no -e: a missing data file or a failed save must never end the shift
        run: |
          cd server
          ./run_24_7.sh "$REGION"
          FILES="bans.txt homes.txt homes_rp.txt mw3_stats.txt progress.txt ranks.txt rp_citizens.txt dayz_survivors.txt turf.txt"
          save() {
            rm -rf /tmp/d; mkdir -p /tmp/d
            for f in $FILES; do [ -s "$f" ] && cp -f "$f" /tmp/d/; done
            [ -n "$(ls -A /tmp/d)" ] || { echo "no server data to save yet"; return 0; }
            ( cd /tmp/d && git init -q -b mp247-data && git add -A &&
              git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
                  commit -qm "server data $(date -u +%F' '%H:%M)" &&
              git push -qf "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:mp247-data ) \
              && echo "server data saved" || echo "saving server data failed (will retry)"
            return 0
          }
          # 4.05.1: another shift newer than this one (not our own successor - we haven't queued it yet) and
          # older than 3 minutes (push / cron runs that only check and leave are gone by then) = a
          # duplicate chain: the older shift hands over to it and stops, so each server is hosted once
          newer() {
            gh run list -R "$GITHUB_REPOSITORY" -w mp-247-servers.yml -s in_progress -L 20 --json databaseId,createdAt \
              --jq "[.[] | select(.databaseId > ${{ github.run_id }}) | select((now - (.createdAt | fromdateiso8601)) > 180)] | length" 2>/dev/null || echo 0
          }
          handover() {
            echo "A newer shift is already online (duplicate) - handing over and stopping this one"
            save; ./run_24_7.sh stop; exit 0
          }
          end=$(( $(date +%s) + SHIFT_MIN * 60 ))
          while [ "$(date +%s)" -lt "$end" ]; do
            sleep 600
            [ "$(newer)" -gt 0 ] && handover
            save
            # 3.59: hot update - a push to main (new server code, a new featured server) is picked up by the
            # shift that is already online, instead of waiting up to 5 h 40 min for the next shift
            if git -C .. fetch -q --depth 1 origin main 2>/dev/null; then
              old=$(git -C .. rev-parse HEAD:server HEAD:src/net 2>/dev/null | tr -d '\n')
              new=$(git -C .. rev-parse FETCH_HEAD:server FETCH_HEAD:src/net 2>/dev/null | tr -d '\n')
              if [ -n "$new" ] && [ "$old" != "$new" ]; then
                echo "New server code on main - updating the running servers"
                save
                git -C .. reset -q --hard FETCH_HEAD
                if make -j"$(nproc)" > logs/build.log 2>&1; then
                  ./run_24_7.sh stop > /dev/null; sleep 2
                  ./run_24_7.sh "$REGION"
                else echo "build failed - keeping the old servers"; tail -n 20 logs/build.log; fi
              fi
            fi
            ./run_24_7.sh "$REGION" > /dev/null   # restarts a server if its loop ever died
            for l in logs/*.log; do [ -f "$l" ] && { echo "== $l"; tail -n 2 "$l"; }; done
          done
          [ "$(newer)" -gt 0 ] && handover   # 4.05.1: never start a second chain
          echo "Queueing the next shift"
          gh workflow run mp-247-servers.yml -R "$GITHUB_REPOSITORY" --ref "${GITHUB_REF_NAME}" -f handoff=true \
            || echo "queueing failed - the hourly safety net will start the next shift"
          sleep $(( OVERLAP_MIN * 60 ))
          save
          ./run_24_7.sh stop
          exit 0
