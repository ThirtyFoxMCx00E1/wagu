name: Website (GitHub Pages)
on:
  push:
    branches: [main]
    paths: ['docs/**', '.github/workflows/pages.yml']
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  # 2.31: build and deploy are separate jobs (GitHub's official layout): the "github-pages"
  # artifact is fully uploaded and finalized before deploy-pages looks for it
  # (fixes "No artifacts named github-pages were found for this workflow run").
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Check the site
        run: test -f docs/index.html && du -sh docs
      # 3.35: the website moved to openmp.com (its own repo). This old address keeps the data files
      # the game and the servers read (regions.txt, broker.txt, versions.json, release.json, ...) and
      # sends visitors of the pages to the new site.
      - name: Old address -> openmp.com
        run: |
          mkdir -p _site && cp -r docs/. _site/
          for f in _site/*.html; do
            n=$(basename "$f")
            printf '<!doctype html><meta charset="utf-8"><title>openmp.com</title><meta http-equiv="refresh" content="0;url=https://thirtyfoxmcx00e1.github.io/openmp.com/%s"><link rel="canonical" href="https://thirtyfoxmcx00e1.github.io/openmp.com/%s"><p>Moved to <a href="https://thirtyfoxmcx00e1.github.io/openmp.com/%s">openmp.com</a></p>\n' "$n" "$n" "$n" > "$f"
          done
      - uses: actions/upload-pages-artifact@v4
        with:
          name: github-pages
          path: _site
          retention-days: 1
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url || steps.deployment2.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
        continue-on-error: true
        with:
          artifact_name: github-pages
      - name: Retry deploy (artifact list can lag a few seconds)
        if: steps.deployment.outcome == 'failure'
        run: sleep 20
      - id: deployment2
        if: steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages
